name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest

      - run: go test -race -coverprofile=coverage.out ./...

      - uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.out
        if: github.event_name == 'push'

  # Keep lockfile coverage and upstream provenance checked independently.
  actions-lock:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  actions-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # 1.32.0 is the first zizmor release that understands actions.lock.
      - run: pipx run zizmor==1.32.0 --min-severity low --offline .github/workflows
